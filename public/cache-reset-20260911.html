<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizando STACKUP HOLD'EM HEROES</title></head><body style="margin:0;background:#020c1d;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px"><div><strong>ATUALIZANDO STACKUP HOLD'EM HEROES...</strong><p>Removendo cache antigo.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(r.scope.includes('/gemeo.stackup.holdem-heroes/'))await r.unregister();}}}catch(e){}try{if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}}catch(e){}try{localStorage.clear();sessionStorage.clear();}catch(e){}location.replace('/gemeo.stackup.holdem-heroes/?fresh='+Date.now());})();</script></body></html>

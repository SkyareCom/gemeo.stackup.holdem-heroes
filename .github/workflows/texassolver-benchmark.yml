name: TexasSolver Calibration Battery

on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmark/texassolver/**'
      - 'lib/gto-range-policy.ts'
      - '.github/workflows/texassolver-benchmark.yml'

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download TexasSolver v0.2.0 Linux
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .texassolver benchmark/texassolver/results
          curl -L --retry 3 --fail \
            https://github.com/bupticybee/TexasSolver/releases/download/v0.2.0/TexasSolver-v0.2.0-Linux.zip \
            -o /tmp/texassolver.zip
          unzip -q /tmp/texassolver.zip -d .texassolver
          BIN=$(find .texassolver -type f -name console_solver | head -1)
          test -n "$BIN"
          chmod +x "$BIN"
          echo "TEXASSOLVER_BIN=$GITHUB_WORKSPACE/$BIN" >> "$GITHUB_ENV"
      - name: Run solver battery
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark/texassolver/results
          python3 benchmark/texassolver/run_battery_strict.py | tee benchmark/texassolver/results/workflow.log
      - name: Extract exact combo strategy bank
        shell: bash
        run: |
          set -euxo pipefail
          python3 benchmark/texassolver/extract_exact_combo_bank.py benchmark/texassolver/results \
            --output benchmark/texassolver/results/exact-combo-bank.json \
            | tee benchmark/texassolver/results/exact-combo-bank.log
      - name: Compare against live Player DNA engine
        shell: bash
        run: |
          set -euxo pipefail
          npx --yes tsx benchmark/texassolver/compare_app_engine.ts benchmark/texassolver/results/summary.json \
            | tee benchmark/texassolver/results/app-engine-comparison.log
      - name: Publish validated exact combo bank
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p data
          cp benchmark/texassolver/results/exact-combo-bank.json data/texassolver-exact-combo-bank.json
          git config user.name "stackup-solver-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/texassolver-exact-combo-bank.json
          if git diff --cached --quiet; then
            echo "Validated runtime bank already current"
          else
            git commit -m "data: promote validated TexasSolver exact combo bank"
            git push origin HEAD:main
          fi
      - name: Upload solver outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texassolver-calibration-results
          path: benchmark/texassolver/results/
          if-no-files-found: warn
          retention-days: 14

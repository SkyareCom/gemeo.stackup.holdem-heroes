name: Build Cloudflare Static Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-static-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare static preview
        run: rm -rf app/api

      - name: Build Cloudflare static site
        env:
          STATIC_EXPORT: "true"
          GITHUB_ACTIONS: "false"
        run: npm run build

      - name: Upload Cloudflare artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-static
          path: ./out
          if-no-files-found: error

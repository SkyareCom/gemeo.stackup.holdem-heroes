name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Promote latest passing TexasSolver bank
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/solver-runtime /tmp/solver-bank
          RUN_JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/texassolver-benchmark.yml/runs?branch=main&status=success&per_page=1")
          RUN_ID=$(jq -r '.workflow_runs[0].id // empty' <<< "$RUN_JSON")
          RUN_HEAD_SHA=$(jq -r '.workflow_runs[0].head_sha // empty' <<< "$RUN_JSON")
          test -n "$RUN_ID"
          test -n "$RUN_HEAD_SHA"

          COMPARE_JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/compare/$RUN_HEAD_SHA...$GITHUB_SHA")
          SOLVER_RELEVANT_CHANGES=$(jq '[.files[]?.filename | select(
            startswith("benchmark/texassolver/") or
            startswith("lib/player-dna-") or
            . == "lib/gto-range-policy.ts" or
            . == ".github/workflows/texassolver-benchmark.yml"
          )] | length' <<< "$COMPARE_JSON")
          if [ "$SOLVER_RELEVANT_CHANGES" -ne 0 ]; then
            echo "Refusing stale TexasSolver artifact: solver-relevant files changed after validated commit $RUN_HEAD_SHA"
            jq -r '.files[]?.filename | select(
              startswith("benchmark/texassolver/") or
              startswith("lib/player-dna-") or
              . == "lib/gto-range-policy.ts" or
              . == ".github/workflows/texassolver-benchmark.yml"
            )' <<< "$COMPARE_JSON"
            exit 1
          fi

          ARTIFACT_ID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?name=texassolver-calibration-results" \
            | jq -r '.artifacts[0].id // empty')
          test -n "$ARTIFACT_ID"
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/solver-bank.zip
          unzip -q /tmp/solver-bank.zip -d /tmp/solver-bank
          test -s /tmp/solver-bank/exact-combo-bank.json
          test "$(jq -r '.nodeCount' /tmp/solver-bank/exact-combo-bank.json)" = "32"
          test "$(jq -r '.exactComboDecisionCount' /tmp/solver-bank/exact-combo-bank.json)" -ge "6456"
          test "$(jq -r '.rejectedBoardCollisionCombos' /tmp/solver-bank/exact-combo-bank.json)" = "0"
          cp /tmp/solver-bank/exact-combo-bank.json data/texassolver-runtime-bank.json
          cp /tmp/solver-bank/exact-combo-bank.json public/solver-runtime/exact-combo-bank.json
          jq --arg solverRunId "$RUN_ID" --arg solverHeadSha "$RUN_HEAD_SHA" --arg deployedHeadSha "$GITHUB_SHA" \
            '{schemaVersion,source,scope,nodeCount,exactComboDecisionCount,rejectedBoardCollisionCombos,solverRunId:$solverRunId,solverHeadSha:$solverHeadSha,deployedHeadSha:$deployedHeadSha}' \
            /tmp/solver-bank/exact-combo-bank.json > public/solver-runtime/manifest.json

      - name: Verify exact solver runtime sessions
        run: npx --yes tsx benchmark/texassolver/verify_runtime_bank.ts data/texassolver-runtime-bank.json

      - name: Prepare static preview
        run: rm -rf app/api

      - name: Build GitHub Pages site
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
